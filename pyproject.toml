[project]
name = "shot-dna"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Camilo Ruiz", email = "juankruizo10@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mplbasketball>=1.0.1",
    "nbformat>=5.11.1",
    "numpy>=1.26,<2.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
shot-dna = "shot_dna:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
